name: Sync ORCID publications

on:
  workflow_dispatch:
  schedule:
    # Monday 03:15 JST = Sunday 18:15 UTC
    - cron: "15 18 * * 0"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch and normalize ORCID works
        env:
          ORCID_CLIENT_ID: ${{ secrets.ORCID_CLIENT_ID }}
          ORCID_CLIENT_SECRET: ${{ secrets.ORCID_CLIENT_SECRET }}
        run: python scripts/sync_orcid.py

      - name: Commit changes if needed
        run: |
          if git diff --quiet -- generated/publications.yml; then
            echo "No ORCID changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/publications.yml
          git commit -m "chore: sync ORCID publications"
          git push
